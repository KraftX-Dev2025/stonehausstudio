<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>A–Z · Stone Haus Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1A1A; --bone:#F4F2EF; --rust:#B46C3A; --stone:#7A7F83;
    --hair:rgba(244,242,239,.14); --hair-soft:rgba(244,242,239,.08);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--bone)}
  body{
    font-family:'DM Sans',system-ui,sans-serif; font-weight:500;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  ::selection{background:var(--rust); color:var(--bone)}
  a{color:inherit; text-decoration:none}
  button{background:none; border:0; color:inherit; padding:0; font:inherit; cursor:pointer; text-align:left}

  /* ---------- TOP NAV ---------- */
  .topnav{
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; padding:26px 60px;
    background:rgba(26,26,26,.78);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--hair-soft);
  }
  .topnav__wordmark{
    font-family:'Outfit',sans-serif; font-weight:700;
    font-size:12px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--bone); justify-self:start; opacity:.9;
    cursor:default;
  }
  .topnav__wordmark .dot{color:var(--rust)}
  .topnav__center{
    display:flex; gap:72px;
    font-family:'Outfit',sans-serif; font-weight:600; font-size:15px;
    color:var(--bone);
  }
  .topnav__center a{padding:2px 0; transition:color .2s}
  .topnav__center a:hover{color:var(--rust)}
  .topnav__center a.is-active{border-bottom:1px solid var(--bone); padding-bottom:1px}
  .topnav__corner{
    justify-self:end;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.3em; color:rgba(244,242,239,.55);
    text-transform:uppercase;
  }

  /* ---------- LAYOUT FRAME ---------- */
  .page{ padding:140px 60px 100px; min-height:100vh; }

  .shell{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:80px;
    align-items:start;
    transition:grid-template-columns .4s ease, gap .4s ease;
  }
  .shell[data-view="index"]{
    grid-template-columns:1fr;
    gap:0;
  }
  .shell[data-view="index"] .rail{ display:none; }

  /* ---------- LEFT RAIL ---------- */
  .rail{
    position:sticky; top:140px;
    font-family:'Outfit',sans-serif; font-weight:600;
    font-size:18px; line-height:1.7;
    color:var(--bone);
  }
  .rail__label{
    font-family:'Outfit',sans-serif; font-weight:700;
    font-size:18px; color:var(--bone);
    margin-bottom:24px;
    display:flex; align-items:center; gap:10px;
  }
  .rail__label .crumb{
    font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size:9px; letter-spacing:.3em; color:var(--stone);
    text-transform:uppercase; padding-left:10px; border-left:1px solid var(--hair);
  }
  .rail__list{ list-style:none; margin:0; padding:0; }
  .rail__list li{ position:relative; padding:5px 0; }
  .rail__list button{
    transition:color .2s, transform .2s, padding-left .2s;
    display:inline-block;
  }
  .rail__list button:hover{ color:var(--rust); }
  .rail__list .is-active > button{
    border-bottom:1px solid var(--bone); padding-bottom:1px;
  }
  .rail__list .is-open > button{ padding-left:28px; }
  .rail__sub{
    list-style:none; margin:4px 0 16px 0;
    padding:0 0 0 56px;
    font-size:16px; font-weight:500;
    color:var(--bone);
    border-left:1px solid var(--hair);
    margin-left:14px;
  }
  .rail__sub li{ padding:3px 0; }
  .rail__sub button{ transition:color .2s; }
  .rail__sub button:hover{ color:var(--rust); }
  .rail__sub .is-active > button{
    color:var(--rust);
    border-bottom:1px solid var(--rust); padding-bottom:1px;
  }

  /* ---------- MAIN COLUMN ---------- */
  .main{ min-width:0; }

  /* INDEX STATE */
  .index-list{
    list-style:none; margin:0; padding:0;
    font-family:'Outfit',sans-serif; font-weight:600;
    font-size:clamp(48px, 7.4vw, 100px);
    line-height:1.18; letter-spacing:-.025em;
    color:var(--bone);
  }
  .index-list li{ padding:6px 0; }
  .index-list button{
    display:inline-flex; align-items:baseline; gap:24px;
    transition:color .25s, transform .3s, letter-spacing .25s;
  }
  .index-list button:hover{ color:var(--rust); transform:translateX(8px); }
  .index-list .ix{
    font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size:13px; letter-spacing:.2em; color:var(--rust);
    transform:translateY(-.4em); opacity:0;
    transition:opacity .25s;
  }
  .index-list button:hover .ix{ opacity:1; }

  /* SERVICE STATE */
  .svc-head{
    font-family:'Outfit',sans-serif; font-weight:700;
    font-size:clamp(56px, 7.4vw, 108px);
    line-height:1; letter-spacing:-.022em;
    margin:0 0 80px 0;
  }
  .svc-head .num{
    color:var(--rust);
    font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size:14px; letter-spacing:.3em;
    vertical-align:top; margin-right:20px;
    display:inline-block; padding-top:14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:40px 32px;
  }
  .card{ cursor:pointer; }
  .thumb{
    aspect-ratio:4/3;
    border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    color:var(--bone);
    position:relative;
    overflow:hidden;
    transition:transform .35s ease;
  }
  .thumb::after{
    content:'';
    position:absolute; inset:10px;
    border:1px solid rgba(244,242,239,0.06);
    pointer-events:none;
  }
  .card:hover .thumb{ transform:scale(1.015); }
  .card-title{
    margin-top:14px;
    font-family:'Outfit',sans-serif; font-weight:500;
    font-size:16px; line-height:1.35;
    color:var(--bone);
  }
  .card-meta{
    margin-top:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:.3em; color:var(--stone);
    text-transform:uppercase;
  }

  .thumb[data-bg="rust"]{ background:radial-gradient(70% 90% at 50% 60%, #b46c3a 0%, #6b3a16 60%, #2a160a 100%); border-color:transparent; }
  .thumb[data-bg="cream"]{ background:radial-gradient(80% 100% at 50% 50%, #f6f3eb 0%, #c3bdaa 60%, #5e574a 100%); color:#1a1a1a; border-color:transparent; }
  .thumb[data-bg="ink"]{ background:radial-gradient(70% 90% at 60% 50%, #2a3140 0%, #14181f 60%, #060709 100%); border-color:transparent; }
  .thumb[data-bg="olive"]{ background:radial-gradient(70% 90% at 50% 55%, #6e715e 0%, #3e4136 60%, #14160f 100%); border-color:transparent; }
  .thumb[data-bg="copper"]{ background:radial-gradient(80% 100% at 35% 40%, #c08b56 0%, #6a4524 60%, #2a1a0c 100%); border-color:transparent; }
  .thumb[data-bg="charcoal"]{ background:radial-gradient(60% 80% at 50% 50%, #2c2c2d 0%, #161616 50%, #0a0a0a 100%); border-color:transparent; }
  .thumb[data-bg="bone"]{ background:radial-gradient(60% 80% at 50% 50%, #f4f2ef 0%, #c2bda9 60%, #6c6557 100%); color:#1a1a1a; border-color:transparent; }
  .thumb[data-bg="claret"]{ background:radial-gradient(70% 90% at 50% 55%, #8d3a3a 0%, #4a1d1d 60%, #160808 100%); border-color:transparent; }
  .thumb[data-bg="forest"]{ background:radial-gradient(70% 90% at 45% 50%, #2f4a36 0%, #182519 60%, #0a100c 100%); border-color:transparent; }
  .thumb[data-bg="indigo"]{ background:radial-gradient(70% 90% at 50% 50%, #3a3d68 0%, #1c1e3a 60%, #0a0a1a 100%); border-color:transparent; }

  .thumb-mark{
    font-family:'Outfit',sans-serif; font-weight:600;
    font-size:18px; letter-spacing:.05em;
    text-transform:uppercase;
    line-height:1.3;
    z-index:1;
  }
  .thumb-mark small{
    display:block;
    font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size:8px; letter-spacing:.3em;
    margin-top:8px;
    opacity:.5;
  }

  /* PROJECT DETAIL STATE */
  .proj-head{
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:48px;
    margin-bottom:60px;
    align-items:start;
  }
  .proj-svc{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.3em;
    color:var(--rust); text-transform:uppercase;
    margin-bottom:18px;
  }
  .proj-client{
    font-family:'DM Sans',sans-serif; font-weight:500;
    font-size:16px; color:var(--stone);
    margin-bottom:14px;
  }
  .proj-title{
    font-family:'Outfit',sans-serif; font-weight:700;
    font-size:clamp(48px, 6.4vw, 88px);
    line-height:1; letter-spacing:-.022em;
    margin:0 0 0 0;
  }
  .proj-body{
    font-family:'DM Sans',sans-serif; font-weight:500;
    font-size:15px; line-height:1.65;
    color:var(--bone);
    max-width:520px;
  }
  .proj-body p{ margin:0 0 18px 0; }
  .proj-body p:last-child{ margin-bottom:0; }
  .proj-body b{ color:var(--rust); font-weight:500; }
  .proj-meta{
    margin-top:36px;
    display:grid;
    grid-template-columns:120px 1fr;
    gap:8px 16px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--stone);
  }
  .proj-meta b{ color:var(--bone); font-weight:500; }

  .media{
    margin-top:60px;
    display:grid; gap:60px;
  }
  .plate{
    aspect-ratio:4/3;
    border:1px solid var(--hair);
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:var(--bone);
  }
  .plate.wide{ aspect-ratio:16/9; }
  .plate.tall{ aspect-ratio:3/4; }
  .plate.cinema{ aspect-ratio:21/9; }
  .plate-caption{
    margin-top:14px;
    font-family:'DM Sans',sans-serif; font-weight:500;
    font-size:14px; color:var(--bone);
  }
  .media .pair{
    display:grid; grid-template-columns:1fr 1fr; gap:32px;
  }

  .next-link{
    margin-top:120px; padding-top:36px;
    border-top:1px solid var(--hair-soft);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Outfit',sans-serif; font-weight:500; font-size:24px;
  }
  .next-link .label{
    font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size:10px; letter-spacing:.3em; color:var(--stone);
    text-transform:uppercase;
  }
  .next-link a{
    font-family:'Outfit',sans-serif; font-weight:600;
    font-size:clamp(28px, 3.4vw, 44px); letter-spacing:-.012em;
    transition:color .2s, gap .2s;
    display:inline-flex; align-items:center; gap:14px;
  }
  .next-link a:hover{ color:var(--rust); }
  .next-link a::after{ content:'→'; color:var(--rust); font-family:'JetBrains Mono',monospace; }

  /* Reveal */
  @keyframes shFadeUp{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none}}
  .view-enter{ animation:shFadeUp .55s cubic-bezier(.2,.7,.2,1) both; }
  .view-enter.d1{ animation-delay:.04s }
  .view-enter.d2{ animation-delay:.1s }
  .view-enter.d3{ animation-delay:.16s }
  .view-enter.d4{ animation-delay:.22s }

  /* Footer */
  .editorial-foot{
    margin-top:120px; border-top:1px solid var(--hair);
    padding:30px 60px; display:flex; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.3em; text-transform:uppercase; color:var(--stone);
  }

  /* Responsive */
  @media (max-width: 980px){
    .topnav{ padding:18px 24px; }
    .topnav__corner{ display:none; }
    .topnav__center{ gap:32px; font-size:13px; }
    .page{ padding:120px 24px 80px; }
    .shell{ grid-template-columns:1fr; gap:24px; }
    .rail{ position:static; }
    .index-list{ font-size:clamp(40px, 12vw, 72px); }
    .grid{ grid-template-columns:1fr 1fr; gap:24px 16px; }
    .proj-head{ grid-template-columns:1fr; gap:18px; }
    .media .pair{ grid-template-columns:1fr; gap:24px; }
    .editorial-foot{ padding:20px 24px; flex-direction:column; gap:6px; }
  }
</style>
</head>
<body>

<nav class="topnav" data-screen-label="Topnav">
  <span class="topnav__wordmark">Stone Haus<span class="dot">.</span></span>
  <div class="topnav__center">
    <a href="A-Z.html" class="is-active">A–Z</a>
    <a href="Work.html">Work</a>
    <a href="Profile.html">Profile</a>
  </div>
  <div class="topnav__corner"><span id="crumb">Index</span></div>
</nav>

<main class="page" data-screen-label="A-Z">
  <div class="shell" id="shell" data-view="index">
    <aside class="rail" id="rail"></aside>
    <section class="main" id="main"></section>
  </div>
</main>

<footer class="editorial-foot">
  <div>© Stone Haus Studio — 2025</div>
  <div>Shoot · Create · Connect</div>
</footer>

<script src="az-data.js"></script>
<script src="az-app.js"></script>
</body>
</html>
